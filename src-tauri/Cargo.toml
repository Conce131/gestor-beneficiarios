[package]
name = "gestor-beneficiarios"
version = "1.1.0"
description = "Gestor local de familias y beneficiarios"
edition = "2021"

[lib]
name = "gestor_beneficiarios_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-store = "2"
tauri-plugin-opener = "2"
